<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>anything2api 登录</title>
<link rel="stylesheet" href="/admin/style.css" />
</head>
<body>
<main class="login">
  <p class="eyebrow">anything2api</p>
  <h1>控制台登录</h1>
  <form id="login-form">
    <input type="text" name="username" placeholder="用户名" autocomplete="username" />
    <input type="password" name="password" placeholder="密码" autocomplete="current-password" required />
    <button id="login-btn" type="submit">登录</button>
    <p id="err" class="error"></p>
  </form>
</main>
<script>
const form = document.getElementById("login-form");
const button = document.getElementById("login-btn");
const errorNode = document.getElementById("err");

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  errorNode.textContent = "";
  button.disabled = true;
  button.textContent = "登录中";
  const data = new FormData(event.target);
  try {
    const response = await fetch("/admin/api/login", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({
        username: data.get("username") || undefined,
        password: data.get("password"),
      }),
    });
    if (response.ok) {
      location.href = "/admin/";
      return;
    }
    errorNode.textContent = response.status === 429 ? "失败次数过多，请稍后再试" : "用户名或密码错误";
  } catch {
    errorNode.textContent = "网络连接失败";
  } finally {
    button.disabled = false;
    button.textContent = "登录";
  }
});
</script>
</body>
</html>
